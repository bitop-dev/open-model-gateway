# The load pod of `spark-env.py check` (load.mjs): requests to the gateway
# Service from before the rolling restart until after it has finished. The key comes from the Secret the check
# creates (omg-check-key) and is deleted with it. __MODEL__ and __SECONDS__
# are set by the check.
apiVersion: v1
kind: Pod
metadata:
  name: omg-check-load
  labels: {app.kubernetes.io/name: omg-check-load}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: load
      image: mirror.gcr.io/library/node:22.23.4-bookworm-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
      command: [node, --preserve-symlinks-main, --preserve-symlinks, /scripts/load.mjs]
      env:
        - {name: OMG_BASE, value: "http://omg:8080"}
        - {name: OMG_MODEL, value: "__MODEL__"}
        - {name: SECONDS_TOTAL, value: "__SECONDS__"}
        - {name: CONCURRENCY, value: "4"}
        - {name: OMG_KEY, valueFrom: {secretKeyRef: {name: omg-check-key, key: key}}}
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 250m, memory: 128Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      volumeMounts:
        - {name: scripts, mountPath: /scripts, readOnly: true}
        # The check's stop marker.
        - {name: tmp, mountPath: /tmp}
  volumes:
    - name: scripts
      configMap: {name: omg-replicas-scripts}
    - name: tmp
      emptyDir: {sizeLimit: 1Mi}
