# The per-environment OIDC issuer of `spark-env.py up --mode replicas`:
# Keycloak with one realm imported from the generated Secret omg-issuer-realm
# (users with generated passwords, the gateway's confidential client with a
# generated secret, a groups claim in the ID token), serving HTTPS with a
# certificate signed by the environment's own CA (Secret omg-issuer-tls). Its
# Service is reachable only inside the namespace (the platform's isolation
# policies) and through `kubectl port-forward` bound to 127.0.0.1. Never the
# passwordless demo issuer. __ISSUER_HOST__ is the Service's cluster name.
apiVersion: v1
kind: Service
metadata:
  name: omg-issuer
  labels: {app.kubernetes.io/name: omg-issuer}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: omg-issuer}
  ports:
    - {name: https, port: 8443, targetPort: https}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omg-issuer
  labels: {app.kubernetes.io/name: omg-issuer}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: omg-issuer}
  template:
    metadata:
      labels: {app.kubernetes.io/name: omg-issuer}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: keycloak
          # Keycloak 26.8.1 (2026-10-31), the multi-arch index pinned by digest.
          image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
          args:
            - start-dev
            - --import-realm
            - --http-enabled=false
            - --https-port=8443
            - --https-certificate-file=/etc/omg-issuer/tls.crt
            - --https-certificate-key-file=/etc/omg-issuer/tls.key
            - --hostname=https://__ISSUER_HOST__:8443
            - --hostname-strict=true
            - --health-enabled=true
          env:
            - {name: KC_LOG_LEVEL, value: WARN}
          ports:
            - {name: https, containerPort: 8443}
            - {name: management, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /health/ready, port: management, scheme: HTTPS}
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: {cpu: 300m, memory: 768Mi}
            limits: {cpu: "1500m", memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /opt/keycloak/data}
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
            - {name: tls, mountPath: /etc/omg-issuer, readOnly: true}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 256Mi}
        - name: realm
          secret: {secretName: omg-issuer-realm}
        - name: tls
          secret: {secretName: omg-issuer-tls}
