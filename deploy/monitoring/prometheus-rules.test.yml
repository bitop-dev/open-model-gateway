# Run with promtool test rules; CI pins the executable and verifies its archive.
rule_files:
  - prometheus-rules.yml
evaluation_interval: 30s
tests:
  - name: missing accounting series never fires
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 0m
        alertname: GatewayAccountingFailures
        exp_alerts: []
      - eval_time: 0m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
      - eval_time: 5m
        alertname: GatewayAccountingFailures
        exp_alerts: []
      - eval_time: 5m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
      - eval_time: 20m
        alertname: GatewayAccountingFailures
        exp_alerts: []
      - eval_time: 20m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
  # A mature series increments once at 15m. The warning waits five minutes;
  # the critical stages page immediately. By 25m both must have cleared.
  - name: one failure on existing counters
    interval: 1m
    input_series:
      - series: up{job="open-model-gateway",instance="gateway-a"}
        values: 1+0x30
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="route_lookup",cause="deadline_in_database",instance="gateway-a"}
        values: 1+0x14 2+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="pool_acquire_and_begin",cause="deadline_in_database",instance="gateway-a"}
        values: 1+0x14 2+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="governance_storage",cause="deadline_in_database",instance="gateway-a"}
        values: 1+0x14 2+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="key_authentication",cause="deadline_in_database",instance="gateway-a"}
        values: 1+0x14 2+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="realtime_admission",cause="deadline_in_database",instance="gateway-a"}
        values: 1+0x14 2+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="job_storage",cause="deadline_in_database",instance="gateway-a"}
        values: 1+0x14 2+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="maintenance",cause="deadline_in_database",instance="gateway-a"}
        values: 1+0x14 2+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="explicit_settlement",cause="deadline_in_database",instance="gateway-a"}
        values: 1+0x14 2+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="cancellation_settlement",cause="deadline_in_database",instance="gateway-a"}
        values: 1+0x14 2+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="realtime_settlement",cause="deadline_in_database",instance="gateway-a"}
        values: 1+0x14 2+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="job_settlement",cause="deadline_in_database",instance="gateway-a"}
        values: 1+0x14 2+0x15
    alert_rule_test:
      - eval_time: 14m
        alertname: GatewayAccountingFailures
        exp_alerts: []
      - eval_time: 14m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
      - eval_time: 15m
        alertname: GatewayAccountingFailures
        exp_alerts: []
      - eval_time: 15m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: &critical_alerts
          - &explicit_settlement_alert
            exp_labels:
              stage: explicit_settlement
              cause: deadline_in_database
              severity: critical
            exp_annotations:
              summary: Settlement failed at explicit_settlement (deadline_in_database); reservations stay held
              description: A settlement failure in the last 10 minutes. Holds are retained, never refunded as zero, and can block budgeted admission until reconciliation. deadline_in_queue or deadline_acquiring_connection point to a starved pool, deadline_in_database to lock or statement waits; for job_settlement the cause is the database error.
              runbook_url: docs/operations.md#accounting-failures
          - exp_labels:
              stage: cancellation_settlement
              cause: deadline_in_database
              severity: critical
            exp_annotations:
              summary: Settlement failed at cancellation_settlement (deadline_in_database); reservations stay held
              description: A settlement failure in the last 10 minutes. Holds are retained, never refunded as zero, and can block budgeted admission until reconciliation. deadline_in_queue or deadline_acquiring_connection point to a starved pool, deadline_in_database to lock or statement waits; for job_settlement the cause is the database error.
              runbook_url: docs/operations.md#accounting-failures
          - exp_labels:
              stage: realtime_settlement
              cause: deadline_in_database
              severity: critical
            exp_annotations:
              summary: Settlement failed at realtime_settlement (deadline_in_database); reservations stay held
              description: A settlement failure in the last 10 minutes. Holds are retained, never refunded as zero, and can block budgeted admission until reconciliation. deadline_in_queue or deadline_acquiring_connection point to a starved pool, deadline_in_database to lock or statement waits; for job_settlement the cause is the database error.
              runbook_url: docs/operations.md#accounting-failures
          - exp_labels:
              stage: job_settlement
              cause: deadline_in_database
              severity: critical
            exp_annotations:
              summary: Settlement failed at job_settlement (deadline_in_database); reservations stay held
              description: A settlement failure in the last 10 minutes. Holds are retained, never refunded as zero, and can block budgeted admission until reconciliation. deadline_in_queue or deadline_acquiring_connection point to a starved pool, deadline_in_database to lock or statement waits; for job_settlement the cause is the database error.
              runbook_url: docs/operations.md#accounting-failures
      - eval_time: 19m
        alertname: GatewayAccountingFailures
        exp_alerts: []
      - eval_time: 19m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: *critical_alerts
      - eval_time: 20m
        alertname: GatewayAccountingFailures
        exp_alerts: &warning_alerts
          - &route_lookup_alert
            exp_labels:
              stage: route_lookup
              cause: deadline_in_database
              severity: warning
            exp_annotations:
              summary: Accounting failing at route_lookup (deadline_in_database); requests get 503 accounting_unavailable
              description: A failure in the last 10 minutes, pending for 5. Check database health, pool saturation (gateway_db_pool_connections) and lock waits; the WARN log line `accounting unavailable` carries the same stage and cause.
              runbook_url: docs/operations.md#accounting-failures
          - exp_labels:
              stage: pool_acquire_and_begin
              cause: deadline_in_database
              severity: warning
            exp_annotations:
              summary: Accounting failing at pool_acquire_and_begin (deadline_in_database); requests get 503 accounting_unavailable
              description: A failure in the last 10 minutes, pending for 5. Check database health, pool saturation (gateway_db_pool_connections) and lock waits; the WARN log line `accounting unavailable` carries the same stage and cause.
              runbook_url: docs/operations.md#accounting-failures
          - exp_labels:
              stage: governance_storage
              cause: deadline_in_database
              severity: warning
            exp_annotations:
              summary: Accounting failing at governance_storage (deadline_in_database); requests get 503 accounting_unavailable
              description: A failure in the last 10 minutes, pending for 5. Check database health, pool saturation (gateway_db_pool_connections) and lock waits; the WARN log line `accounting unavailable` carries the same stage and cause.
              runbook_url: docs/operations.md#accounting-failures
          - exp_labels:
              stage: key_authentication
              cause: deadline_in_database
              severity: warning
            exp_annotations:
              summary: Accounting failing at key_authentication (deadline_in_database); requests get 503 accounting_unavailable
              description: A failure in the last 10 minutes, pending for 5. Check database health, pool saturation (gateway_db_pool_connections) and lock waits; the WARN log line `accounting unavailable` carries the same stage and cause.
              runbook_url: docs/operations.md#accounting-failures
          - exp_labels:
              stage: realtime_admission
              cause: deadline_in_database
              severity: warning
            exp_annotations:
              summary: Accounting failing at realtime_admission (deadline_in_database); requests get 503 accounting_unavailable
              description: A failure in the last 10 minutes, pending for 5. Check database health, pool saturation (gateway_db_pool_connections) and lock waits; the WARN log line `accounting unavailable` carries the same stage and cause.
              runbook_url: docs/operations.md#accounting-failures
          - exp_labels:
              stage: job_storage
              cause: deadline_in_database
              severity: warning
            exp_annotations:
              summary: Accounting failing at job_storage (deadline_in_database); requests get 503 accounting_unavailable
              description: A failure in the last 10 minutes, pending for 5. Check database health, pool saturation (gateway_db_pool_connections) and lock waits; the WARN log line `accounting unavailable` carries the same stage and cause.
              runbook_url: docs/operations.md#accounting-failures
          - exp_labels:
              stage: maintenance
              cause: deadline_in_database
              severity: warning
            exp_annotations:
              summary: Accounting failing at maintenance (deadline_in_database); requests get 503 accounting_unavailable
              description: A failure in the last 10 minutes, pending for 5. Check database health, pool saturation (gateway_db_pool_connections) and lock waits; the WARN log line `accounting unavailable` carries the same stage and cause.
              runbook_url: docs/operations.md#accounting-failures
      - eval_time: 20m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: *critical_alerts
      - eval_time: 23m
        alertname: GatewayAccountingFailures
        exp_alerts: *warning_alerts
      - eval_time: 23m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: *critical_alerts
      - eval_time: 25m
        alertname: GatewayAccountingFailures
        exp_alerts: []
      - eval_time: 25m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
  # No zero-valued warm-up: the first sample is 1 at 15m. A zero increase
  # after the second scrape must not mask the new-series term.
  - name: new series starts at its first failure
    interval: 1m
    input_series:
      - series: up{job="open-model-gateway",instance="gateway-a"}
        values: 1+0x30
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="route_lookup",cause="deadline_in_database",instance="gateway-a"}
        values: _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="pool_acquire_and_begin",cause="deadline_in_database",instance="gateway-a"}
        values: _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="governance_storage",cause="deadline_in_database",instance="gateway-a"}
        values: _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="key_authentication",cause="deadline_in_database",instance="gateway-a"}
        values: _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="realtime_admission",cause="deadline_in_database",instance="gateway-a"}
        values: _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="job_storage",cause="deadline_in_database",instance="gateway-a"}
        values: _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="maintenance",cause="deadline_in_database",instance="gateway-a"}
        values: _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="explicit_settlement",cause="deadline_in_database",instance="gateway-a"}
        values: _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="cancellation_settlement",cause="deadline_in_database",instance="gateway-a"}
        values: _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="realtime_settlement",cause="deadline_in_database",instance="gateway-a"}
        values: _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="job_settlement",cause="deadline_in_database",instance="gateway-a"}
        values: _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1+0x15
    alert_rule_test:
      - eval_time: 14m
        alertname: GatewayAccountingFailures
        exp_alerts: []
      - eval_time: 14m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
      - eval_time: 15m
        alertname: GatewayAccountingFailures
        exp_alerts: []
      - eval_time: 15m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: *critical_alerts
      - eval_time: 19m
        alertname: GatewayAccountingFailures
        exp_alerts: []
      - eval_time: 19m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: *critical_alerts
      - eval_time: 20m
        alertname: GatewayAccountingFailures
        exp_alerts: *warning_alerts
      - eval_time: 20m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: *critical_alerts
      - eval_time: 23m
        alertname: GatewayAccountingFailures
        exp_alerts: *warning_alerts
      - eval_time: 23m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: *critical_alerts
      - eval_time: 25m
        alertname: GatewayAccountingFailures
        exp_alerts: []
      - eval_time: 25m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
  - name: unchanged counters recover from a short scrape outage
    interval: 1m
    input_series:
      - series: up{job="open-model-gateway",instance="gateway-a"}
        values: 1+0x19 0+0x5 1+0x19
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="route_lookup",cause="deadline_in_database",instance="gateway-a"}
        values: 1+0x19 stale _ _ _ _ _ 1+0x19
      - series: gateway_accounting_failures_total{job="open-model-gateway",stage="explicit_settlement",cause="deadline_in_database",instance="gateway-a"}
        values: 1+0x19 stale _ _ _ _ _ 1+0x19
    alert_rule_test:
      # Scrapes resume at 26m. At 30m the offset reaches the start of the gap.
      - eval_time: 26m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
      - eval_time: 30m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
      - eval_time: 35m
        alertname: GatewayAccountingFailures
        exp_alerts: []
  - name: first failure after a restart with the same instance labels
    interval: 1m
    input_series:
      # The old process last reported at 19m. The restarted process is
      # scraped successfully from 20m, but its first failure is at 35m.
      - series: up{job="open-model-gateway",instance="gateway-a"}
        values: 1+0x50
      - series: gateway_accounting_failures_total{job="open-model-gateway",instance="gateway-a",stage="route_lookup",cause="deadline_in_database"}
        values: 1+0x19 stale _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",instance="gateway-a",stage="explicit_settlement",cause="deadline_in_database"}
        values: 1+0x19 stale _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1+0x15
    alert_rule_test:
      - eval_time: 34m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
      - eval_time: 35m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: [*explicit_settlement_alert]
      - eval_time: 39m
        alertname: GatewayAccountingFailures
        exp_alerts: []
      - eval_time: 40m
        alertname: GatewayAccountingFailures
        exp_alerts: [*route_lookup_alert]
      - eval_time: 44m
        alertname: GatewayAccountingFailures
        exp_alerts: [*route_lookup_alert]
      - eval_time: 44m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: [*explicit_settlement_alert]
      - eval_time: 45m
        alertname: GatewayAccountingFailures
        exp_alerts: []
      - eval_time: 45m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
  - name: a failure during a short scrape outage fires on recovery
    interval: 1m
    input_series:
      - series: up{job="open-model-gateway",instance="gateway-a"}
        values: 1+0x19 0+0x3 1+0x19
      - series: gateway_accounting_failures_total{job="open-model-gateway",instance="gateway-a",stage="explicit_settlement",cause="deadline_in_database"}
        values: 1+0x19 stale _ _ _ 2+0x19
    alert_rule_test:
      - eval_time: 23m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
      - eval_time: 24m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: [*explicit_settlement_alert]
      - eval_time: 28m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: [*explicit_settlement_alert]
      - eval_time: 29m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
  - name: a lower counter after restart counts as a reset
    interval: 1m
    input_series:
      - series: up{job="open-model-gateway",instance="gateway-a"}
        values: 1+0x39
      - series: gateway_accounting_failures_total{job="open-model-gateway",instance="gateway-a",stage="explicit_settlement",cause="deadline_in_database"}
        values: 5+0x19 1+0x19
    alert_rule_test:
      - eval_time: 19m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
      - eval_time: 20m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: [*explicit_settlement_alert]
      - eval_time: 29m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
  - name: a long scrape outage can re-fire an unchanged counter once
    interval: 1m
    input_series:
      - series: up{job="open-model-gateway",instance="gateway-a"}
        values: 1+0x19 0+0x14 1+0x24
      - series: gateway_accounting_failures_total{job="open-model-gateway",instance="gateway-a",stage="route_lookup",cause="deadline_in_database"}
        values: 1+0x19 stale _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1+0x24
      - series: gateway_accounting_failures_total{job="open-model-gateway",instance="gateway-a",stage="explicit_settlement",cause="deadline_in_database"}
        values: 1+0x19 stale _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1+0x24
    alert_rule_test:
      - eval_time: 34m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
      - eval_time: 35m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
      # At 39m the old samples leave the offset window.
      - eval_time: 38m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
      - eval_time: 39m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: [*explicit_settlement_alert]
      - eval_time: 43m
        alertname: GatewayAccountingFailures
        exp_alerts: []
      - eval_time: 44m
        alertname: GatewayAccountingFailures
        exp_alerts: [*route_lookup_alert]
      - eval_time: 44m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: [*explicit_settlement_alert]
      - eval_time: 45m
        alertname: GatewayAccountingFailures
        exp_alerts: []
      - eval_time: 45m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
      - eval_time: 59m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
  - name: metrics outage pages only after five minutes and clears on recovery
    interval: 1m
    input_series:
      - series: up{job="open-model-gateway",instance="gateway-a"}
        values: 1+0x4 0+0x5 1+0x4
      - series: up{job="other-service",instance="other"}
        values: 0+0x15
    alert_rule_test:
      - eval_time: 9m
        alertname: GatewayMetricsDown
        exp_alerts: []
      - eval_time: 10m
        alertname: GatewayMetricsDown
        exp_alerts:
          - exp_labels:
              job: open-model-gateway
              instance: gateway-a
              severity: critical
            exp_annotations:
              summary: Gateway metrics endpoint is unreachable
              description: gateway-a has not been scraped for 5 minutes. Check the process, GATEWAY_METRICS_ADDR and the private scrape network.
      - eval_time: 11m
        alertname: GatewayMetricsDown
        exp_alerts: []
  - name: a scrape outage between restart and first observed failure
    interval: 15s
    input_series:
      # At 20m the restarted target omits the counter. From 28m15s its
      # scrapes fail, then at 34m the counter is first observed again.
      - series: up{job="open-model-gateway",instance="gateway-a"}
        values: 1+0x112 0+0x22 1+0x23 0+0x7 1+0x11 0+0x7 1+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",instance="gateway-a",stage="route_lookup",cause="deadline_in_database"}
        values: 1+0x79 stale _x54 1+0x23 stale _x7 1+0x11 stale _x7 1+0x15
      - series: gateway_accounting_failures_total{job="open-model-gateway",instance="gateway-a",stage="explicit_settlement",cause="deadline_in_database"}
        values: 1+0x79 stale _x54 1+0x23 stale _x7 1+0x11 stale _x7 1+0x15
    alert_rule_test:
      - eval_time: 33m30s
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
      - eval_time: 33m30s
        alertname: GatewayAccountingFailures
        exp_alerts: []
      - eval_time: 34m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: [*explicit_settlement_alert]
      - eval_time: 34m
        alertname: GatewayAccountingFailures
        exp_alerts: []
      - eval_time: 38m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: [*explicit_settlement_alert]
      - eval_time: 38m
        alertname: GatewayAccountingFailures
        exp_alerts: []
      - eval_time: 38m30s
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: [*explicit_settlement_alert]
      - eval_time: 38m30s
        alertname: GatewayAccountingFailures
        exp_alerts: []
      - eval_time: 39m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: [*explicit_settlement_alert]
      - eval_time: 39m
        alertname: GatewayAccountingFailures
        exp_alerts: [*route_lookup_alert]
      - eval_time: 40m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: [*explicit_settlement_alert]
      - eval_time: 40m
        alertname: GatewayAccountingFailures
        exp_alerts: [*route_lookup_alert]
      # The scrape is down at 40m and returns at 42m. The recorded
      # failures stay eligible while the scrape has no counter sample.
      - eval_time: 41m30s
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: [*explicit_settlement_alert]
      - eval_time: 41m30s
        alertname: GatewayAccountingFailures
        exp_alerts: [*route_lookup_alert]
      - eval_time: 42m
        alertname: GatewayAccountingFailures
        exp_alerts: [*route_lookup_alert]
      - eval_time: 43m30s
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: [*explicit_settlement_alert]
      - eval_time: 43m30s
        alertname: GatewayAccountingFailures
        exp_alerts: [*route_lookup_alert]
      - eval_time: 44m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
      - eval_time: 44m
        alertname: GatewayAccountingFailures
        exp_alerts: []
      # Another outage begins at 45m. At 47m the same counter returns.
      - eval_time: 47m
        alertname: GatewaySettlementAccountingFailures
        exp_alerts: []
    promql_expr_test:
      - expr: sum(count_over_time(instance_stage_cause:accounting_failure_series:first_observed[15m]))
        eval_time: 47m
        exp_samples:
          # One first observation for each of the two counters.
          - labels: '{}'
            value: 2
  # s3 loses one request per ten new connections: pending, then firing after
  # 30 minutes. local opens connections without losses, and openai's ratio is
  # high but on two losses in 30 minutes: neither fires.
  - name: upstream connection loss per new connection
    interval: 1m
    input_series:
      - series: gateway_upstream_connection_lost_total{job="open-model-gateway",instance="gateway-a",client="s3"}
        values: 0+1x70
      - series: gateway_upstream_connections_opened_total{job="open-model-gateway",instance="gateway-a",client="s3"}
        values: 0+10x70
      - series: gateway_upstream_connections_opened_total{job="open-model-gateway",instance="gateway-a",client="local"}
        values: 0+50x70
      - series: gateway_upstream_connection_lost_total{job="open-model-gateway",instance="gateway-a",client="openai"}
        values: 0+0x30 1+0x19 2+0x20
      - series: gateway_upstream_connections_opened_total{job="open-model-gateway",instance="gateway-a",client="openai"}
        values: 1+0x30 2+0x19 3+0x20
    alert_rule_test:
      - eval_time: 20m
        alertname: GatewayUpstreamConnectionLoss
        exp_alerts: []
      - eval_time: 60m
        alertname: GatewayUpstreamConnectionLoss
        exp_alerts:
          - exp_labels:
              client: s3
              severity: info
            exp_annotations:
              summary: s3 loses more than one request per 100 new connections
              description: "See docs/operations.md \"Lost connections\": compare with the client's pool idle timeout and its upstream's keep-alive."
