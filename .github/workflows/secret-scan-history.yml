# The weekly full-history secret scan (#603): the whole history of main and every tag, with
# the pinned scanner and the repository's config, in the same job as ci.yml's `secret-scan`
# (tests/supply-chain/secret-scan.test.mjs keeps the two equal). It looks again at what a
# pull request or push scan never saw: a commit that skipped CI, a branch merged without a
# pull request, a tag that is not `v*`, and rules a scanner or config update added since.
#
# A finding fails the run; GitHub notifies the account that last changed the schedule
# about a failed scheduled run (that account's Actions notification settings). The run opens no issue: that needs a token that can write, and an
# issue on a public repository would publish where a live secret is before it is rotated.
# The log shows rule, file, line and commit only.
name: secret-scan-history

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EVENT_NAME: ${{ github.event_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BEFORE_SHA: ${{ github.event.before }}
      AFTER_SHA: ${{ github.sha }}
    steps:
      # The whole history, so every commit of the range is there (a secret added in one
      # commit and removed in the next is still in the range) and a forced or first push
      # can be scanned from the start.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks 8.30.1 (MIT). The SHA-256 is the linux_x64 line of the release's
      # gitleaks_8.30.1_checksums.txt, which also equals the digest GitHub records for the asset.
      - name: Install gitleaks (pinned release, SHA-256 verified)
        run: |
          set -euo pipefail
          bash .github/scripts/fetch-verified.sh https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "${RUNNER_TEMP}/gitleaks.tar.gz"
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/gitleaks-bin/gitleaks" version
      # Pull request: base..head, every commit the pull request adds (a merge of main into
      # the branch is excluded by the base). Push: before..after; a new ref or a force push
      # whose old tip is gone is scanned from the whole history. Schedule and manual run
      # (secret-scan-history.yml): the whole history of origin/main and every tag. `-m` shows
      # a merge commit's changes (plain `git log -p` shows none) and `--text` scans files that
      # a .gitattributes `-diff` or a NUL byte would hide. The tree scan covers the final
      # state. What `gitleaks git` does not read (commit and tag messages, file names, archive
      # and UTF-16 blobs) is written as plain files by secret-scan-extras.py and scanned with
      # `gitleaks dir`; archives are opened two levels deep. Every scan runs with this
      # checkout's config and, when there is a base commit, also with the base's own
      # .gitleaks.toml read from its git objects (nothing from the change runs), so a change
      # cannot widen the allowlist and pass. Findings print as rule, file, line and commit
      # only (a report template, never the matched line), the secret is redacted, an inline
      # gitleaks:allow comment is ignored, and any finding fails the job. The canaries prove,
      # with this config and these options, that the git, dir and extras paths still detect.
      - name: Scan the commits and the tree for secrets
        run: |
          set -euo pipefail
          # Findings name files, and a file name can hold a newline: workflow commands
          # (::add-mask::, ::stop-commands:: ...) stay off for the rest of the step.
          echo "::stop-commands::$(cat /proc/sys/kernel/random/uuid)"
          zeros=0000000000000000000000000000000000000000
          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT
          extras="${PWD}/.github/scripts/secret-scan-extras.py"
          printf '%s\n' '{{ range . }}finding rule={{ .RuleID }} file={{ .File }} line={{ .StartLine }} commit={{ .Commit }}' '{{ end }}' > "${work}/report.tmpl"
          common=(--redact --no-banner --no-color --ignore-gitleaks-allow --max-archive-depth 2 --log-level info --report-format template --report-template "${work}/report.tmpl" --report-path -)
          plant() {
            printf 'aws_access_key_id = %s%s\n' AKIA ZR7QXMLK3PWNB5TD > "$1/aws.txt"
            printf 'token = omg_%s.%s\n' "$(printf 'ab%.0s' {1..16})" "$(printf 'cd%.0s' {1..32})" > "$1/gateway.txt"
            printf 'Cookie: omg_session=%s\n' "$(printf 'ef%.0s' {1..32})" > "$1/session.txt"
            printf 'GATEWAY_FILE_KEYS=canary:%s%s=\n' "$(printf 'Aq9Zk3Lm%.0s' {1..5})" Wxy > "$1/filekey.txt"
            printf 'url = postgres://svc:%s@db.internal:5432/app\n' K9m2Xv7Qp4Zr8 > "$1/url.txt"
            printf '%s_%s = "%s"\n' API KEY k8Jd2Qm7Xv4Zp9Lr3Wt6Yb1Nc5 > "$1/api.txt"
            { printf -- '-----%s PRIVATE KEY-----\n' BEGIN; printf 'QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVo=%.0s\n' {1..3}; printf -- '-----%s PRIVATE KEY-----\n' END; } > "$1/key.pem"
          }
          expect_rules() {
            for rule in aws-access-token omg-gateway-key omg-session-cookie omg-file-encryption-key omg-url-credentials generic-api-key private-key; do
              grep -q "finding rule=${rule} " <<<"$2" || { echo "canary ($1): rule ${rule} did not fire, so the scanner or its config is broken" >&2; exit 1; }
            done
          }
          mkdir "${work}/dir-canary" "${work}/git-canary"
          plant "${work}/dir-canary"
          if report="$(gitleaks dir "${common[@]}" --config .gitleaks.toml "${work}/dir-canary" 2>/dev/null)"; then
            echo "canary (dir): nothing was detected, so the scanner or its config is broken" >&2
            exit 1
          fi
          expect_rules dir "${report}"
          plant "${work}/git-canary"
          printf '*.txt -diff\n' > "${work}/git-canary/.gitattributes"
          # The extras canary: a made-up key in a commit message, a tag message, a file name,
          # a UTF-16 file and a .tgz archive, each of which `gitleaks git` alone does not read.
          printf 'aws_access_key_id = %s%s\n' AKIA ZR7QXMLK3PWNB5TD | iconv -f UTF-8 -t UTF-16LE > "${work}/git-canary/utf16.txt"
          mkdir "${work}/tgz-canary"
          printf 'aws_access_key_id = %s%s\n' AKIA ZR7QXMLK3PWNB5TD > "${work}/tgz-canary/creds.txt"
          tar -czf "${work}/git-canary/bundle.tgz" -C "${work}/tgz-canary" creds.txt
          : > "${work}/git-canary/$(printf '%s%s' AKIA ZR7QXMLK3PWNB5TD).txt"
          git -C "${work}/git-canary" init -q
          git -C "${work}/git-canary" add -A
          git -C "${work}/git-canary" -c user.name=canary -c user.email=canary@example.invalid -c commit.gpgsign=false commit -q -m "canary aws_access_key_id = $(printf '%s%s' AKIA ZR7QXMLK3PWNB5TD)"
          git -C "${work}/git-canary" -c user.name=canary -c user.email=canary@example.invalid -c tag.gpgsign=false tag -a canary -m "canary aws_access_key_id = $(printf '%s%s' AKIA ZR7QXMLK3PWNB5TD)"
          if report="$(gitleaks git "${common[@]}" --config .gitleaks.toml --log-opts="-m --text HEAD" "${work}/git-canary" 2>/dev/null)"; then
            echo "canary (git): nothing was detected, so the scanner or its config is broken" >&2
            exit 1
          fi
          expect_rules git "${report}"
          (cd "${work}/git-canary" && python3 -I "${extras}" "${work}/extras-canary" --tag-messages HEAD --tags)
          if report="$(gitleaks dir "${common[@]}" --config .gitleaks.toml "${work}/extras-canary" 2>/dev/null)"; then
            echo "canary (extras): nothing was detected, so the extras or the scanner are broken" >&2
            exit 1
          fi
          for source in messages.txt tags.txt names.txt utf16/ archives/; do
            grep -q "finding rule=aws-access-token file=${work}/extras-canary/${source}" <<<"${report}" || { echo "canary (extras): nothing found in ${source}, so that pass is broken" >&2; exit 1; }
          done
          is_commit() {
            [[ "$1" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$1^{commit}" 2>/dev/null
          }
          base=""
          tags=()
          case "${EVENT_NAME}" in
            pull_request)
              is_commit "${BASE_SHA}" || { echo "BASE_SHA is not a commit of this checkout" >&2; exit 1; }
              is_commit "${HEAD_SHA}" || { echo "HEAD_SHA is not a commit of this checkout" >&2; exit 1; }
              range="${BASE_SHA}..${HEAD_SHA}"
              base="${BASE_SHA}"
              ;;
            push)
              is_commit "${AFTER_SHA}" || { echo "AFTER_SHA is not a commit of this checkout" >&2; exit 1; }
              if [ "${BEFORE_SHA}" = "${zeros}" ]; then
                range="${AFTER_SHA}"
              elif [[ "${BEFORE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
                if is_commit "${BEFORE_SHA}"; then range="${BEFORE_SHA}..${AFTER_SHA}"; base="${BEFORE_SHA}"; else range="${AFTER_SHA}"; fi
              else
                echo "BEFORE_SHA is neither a commit id nor the zero id" >&2
                exit 1
              fi
              ;;
            schedule|workflow_dispatch)
              main="$(git rev-parse --verify --quiet 'refs/remotes/origin/main^{commit}')" || { echo "origin/main is not in this checkout" >&2; exit 1; }
              range="${main} --tags"
              tags=(--tag-messages)
              echo "scanning the whole history of origin/main and $(git tag -l | wc -l) tags"
              ;;
            *)
              echo "unexpected event ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac
          # The revisions as git arguments: commit ids, a range of two, and on the schedule
          # --tags, all checked above.
          read -r -a revs <<<"${range}"
          configs=(.gitleaks.toml)
          if [ -z "${base}" ]; then
            echo "no base commit (a new ref, a forced push or the scheduled scan): scanning with this checkout's config only"
          elif git cat-file -e "${base}:.gitleaks.toml" 2>/dev/null; then
            git cat-file blob "${base}:.gitleaks.toml" > "${work}/base-config.toml"
            configs+=("${work}/base-config.toml")
            echo "also scanning with the .gitleaks.toml of the base ${base}"
          else
            echo "the base ${base} has no .gitleaks.toml: scanning with this checkout's config only"
          fi
          commits="$(git rev-list --count "${revs[@]}")"
          if [ "${commits}" -eq 0 ]; then
            echo "range ${range} holds no commits; nothing to scan in the history, scanning the tree"
            mkdir "${work}/extras"
          else
            echo "scanning ${commits} commits of ${range}"
            python3 -I "${extras}" "${work}/extras" "${tags[@]}" "${revs[@]}"
          fi
          for config in "${configs[@]}"; do
            if [ "${commits}" -gt 0 ]; then
              status=0
              gitleaks git "${common[@]}" --config "${config}" --log-opts="-m --text ${range}" . 2>"${work}/gitleaks.log" || status=$?
              cat "${work}/gitleaks.log" >&2
              [ "${status}" -eq 0 ] || exit "${status}"
              # gitleaks exits 0 when its git log fails; it did not get that far if it never
              # reports the number of commits it scanned. (The number is not compared with
              # rev-list: it leaves out commits without added lines, such as pure renames.)
              grep -Eq '[0-9]+ commits scanned' "${work}/gitleaks.log" || { echo "gitleaks did not report scanning any commits" >&2; exit 1; }
            fi
            gitleaks dir "${common[@]}" --config "${config}" "${work}/extras"
            gitleaks dir "${common[@]}" --config "${config}" .
          done
